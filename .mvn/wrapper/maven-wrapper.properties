# Maven used by ./mvnw and mvnw.cmd. The wrappers download it once into ~/.m2/wrapper/dists.
# To pin the download, add the archive's SHA-256 (from the .sha512/.sha256 files next to it on
# Maven Central, or `sha256sum` of a verified copy):
#   distributionSha256Sum=<hex>
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.tar.gz
