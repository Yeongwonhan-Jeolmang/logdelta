# GitHub Action wrapper around `logdelta check`. Documentation: docs/GITHUB_ACTION.md

name: LogDelta check
description: Compare a run's log with known-good baselines, fail only on new problems, and post a summary on the pull request.
author: Hana Eun-Seo
branding:
  icon: triangle
  color: orange

inputs:
  candidate:
    description: Log file, folder or URL produced by this run.
    required: true
  baseline:
    description: Known-good run(s). One per line; files, folders or URLs. Leave empty when using baseline-dir.
    required: false
    default: ''
  baseline-dir:
    description: Folder of accepted runs (every file is a known-good run). Pair with update-on-pass and a cache.
    required: false
    default: ''
  profile:
    description: A LogDelta profile (.ldprofile) with rules and options.
    required: false
    default: ''
  fail-on:
    description: 'What fails the step: problems (new warnings or errors), errors, or changes.'
    required: false
    default: problems
  update-on-pass:
    description: Add the candidate to the baselines when the check passes (rolling baseline).
    required: false
    default: 'false'
  args:
    description: Further `logdelta check` options, e.g. "--multiline --mask 'tenant=\w+'".
    required: false
    default: ''
  comment:
    description: Post the Markdown summary as a pull-request comment (needs pull-requests write permission).
    required: false
    default: 'true'
  comment-mode:
    description: update (edit LogDelta's previous comment) or new (always add a comment).
    required: false
    default: update
  comment-on-pass:
    description: Also comment when nothing new went wrong (an existing comment is always updated).
    required: false
    default: 'false'
  junit:
    description: Where to write the JUnit XML report, for test-report actions.
    required: false
    default: logdelta-junit.xml
  fail:
    description: Set to false to only report and never fail the step.
    required: false
    default: 'true'
  java-version:
    description: Java version used to build and run LogDelta (25 or newer).
    required: false
    default: '25'
  github-token:
    description: Token used to post the comment.
    required: false
    default: ${{ github.token }}

outputs:
  result:
    description: pass or fail
    value: ${{ steps.check.outputs.result }}
  new-problems:
    description: Number of new problems.
    value: ${{ steps.summary.outputs.new-problems }}
  markdown:
    description: Path of the Markdown summary.
    value: ${{ steps.check.outputs.markdown }}
  json:
    description: Path of the JSON report.
    value: ${{ steps.check.outputs.json }}
  junit:
    description: Path of the JUnit XML report.
    value: ${{ steps.check.outputs.junit }}

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Build LogDelta
      shell: bash
      run: |
        if [ ! -f "$GITHUB_ACTION_PATH/dist/logdelta.jar" ]; then
          sh "$GITHUB_ACTION_PATH/scripts/build-without-maven.sh" > "$RUNNER_TEMP/logdelta-build.log" 2>&1 \
            || { cat "$RUNNER_TEMP/logdelta-build.log"; exit 1; }
        fi
        echo "LOGDELTA_JAR=$GITHUB_ACTION_PATH/dist/logdelta.jar" >> "$GITHUB_ENV"

    - name: Compare
      id: check
      shell: bash
      env:
        INPUT_CANDIDATE: ${{ inputs.candidate }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_BASELINE_DIR: ${{ inputs.baseline-dir }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_UPDATE_ON_PASS: ${{ inputs.update-on-pass }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_JUNIT: ${{ inputs.junit }}
      run: |
        set -u
        md="$RUNNER_TEMP/logdelta-summary.md"
        json="$RUNNER_TEMP/logdelta-report.json"
        cmd=(java -jar "$LOGDELTA_JAR" check --github --color never --fail-on "$INPUT_FAIL_ON"
             --report "markdown:$md" --report "json:$json" --report "junit:$INPUT_JUNIT")
        while IFS= read -r b; do
          [ -n "$b" ] && cmd+=(--baseline "$b")
        done <<< "$INPUT_BASELINE"
        [ -n "$INPUT_BASELINE_DIR" ] && cmd+=(--baseline-dir "$INPUT_BASELINE_DIR")
        [ -n "$INPUT_PROFILE" ] && cmd+=(--profile "$INPUT_PROFILE")
        [ "$INPUT_UPDATE_ON_PASS" = "true" ] && cmd+=(--update-on-pass)
        if [ -n "$INPUT_ARGS" ]; then
          eval "extra=($INPUT_ARGS)"
          cmd+=("${extra[@]}")
        fi
        cmd+=("$INPUT_CANDIDATE")
        set +e
        "${cmd[@]}"
        code=$?
        set -e
        echo "markdown=$md" >> "$GITHUB_OUTPUT"
        echo "json=$json" >> "$GITHUB_OUTPUT"
        echo "junit=$INPUT_JUNIT" >> "$GITHUB_OUTPUT"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        case "$code" in
          0) echo "result=pass" >> "$GITHUB_OUTPUT" ;;
          1) echo "result=fail" >> "$GITHUB_OUTPUT" ;;
          *) echo "::error title=LogDelta::logdelta check could not run (exit code $code)"; exit "$code" ;;
        esac

    - name: Summarise
      id: summary
      uses: actions/github-script@v9
      env:
        REPORT_JSON: ${{ steps.check.outputs.json }}
      with:
        script: |
          const fs = require('fs');
          let n = 0;
          if (fs.existsSync(process.env.REPORT_JSON)) {
            const r = JSON.parse(fs.readFileSync(process.env.REPORT_JSON, 'utf8'));
            n = r.kind === 'folder' ? r.newProblems : (r.insights?.newProblems ?? []).length;
          }
          core.setOutput('new-problems', String(n));

    - name: Comment on the pull request
      if: inputs.comment == 'true' && github.event.pull_request != null
      uses: actions/github-script@v9
      env:
        REPORT_MD: ${{ steps.check.outputs.markdown }}
        RESULT: ${{ steps.check.outputs.result }}
        MODE: ${{ inputs.comment-mode }}
        ON_PASS: ${{ inputs.comment-on-pass }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const marker = '<!-- logdelta-check -->';
          const limit = 60000;
          let body = fs.existsSync(process.env.REPORT_MD) ? fs.readFileSync(process.env.REPORT_MD, 'utf8') : '';
          if (!body) {
            body = '_No baseline yet: this run was stored as the first known-good run._\n';
          }
          if (body.length > limit) {
            body = body.slice(0, limit) + '\n\n_The summary was shortened; see the job summary for the rest._\n';
          }
          const verdict = process.env.RESULT === 'pass' ? '✅ **LogDelta:** no new problems' : '❌ **LogDelta:** new problems found';
          const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const text = `${marker}\n${verdict} · [run](${run})\n\n${body}`;
          const issue_number = context.payload.pull_request.number;
          const { owner, repo } = context.repo;
          let existing = null;
          if (process.env.MODE === 'update') {
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            existing = comments.find(c => c.body && c.body.startsWith(marker));
          }
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: text });
          } else if (process.env.RESULT !== 'pass' || process.env.ON_PASS === 'true') {
            await github.rest.issues.createComment({ owner, repo, issue_number, body: text });
          }

    - name: Fail on new problems
      if: inputs.fail == 'true' && steps.check.outputs.result == 'fail'
      shell: bash
      run: |
        echo "::error title=LogDelta::New problems compared with the baseline; see the summary above."
        exit 1
