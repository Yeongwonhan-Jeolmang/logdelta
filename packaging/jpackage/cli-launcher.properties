# Second launcher installed next to the desktop app: always runs the command line.
# Used as "logdelta-cli check --baseline good.log build/app.log" (on Windows from a console).
java-options=-Dlogdelta.launcher=cli -XX:MaxRAMPercentage=75
win-console=true
description=LogDelta command line
# A console tool needs no menu entry or desktop shortcut.
linux-shortcut=false
win-shortcut=false
win-menu=false
