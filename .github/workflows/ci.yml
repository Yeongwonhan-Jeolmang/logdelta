name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      installers:
        description: Build the native installers
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The names of the build and action jobs are required checks in .github/rulesets/main-checks.json;
  # keep the two in sync when changing the matrix or a job name.
  build:
    name: Build (Java ${{ matrix.java }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: ['25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Smoke-test the all-in-one jar
        shell: bash
        run: |
          JAR=$(ls logdelta-app/target/logdelta-*.jar | head -1)
          java -jar "$JAR" --version
          set +e
          java -jar "$JAR" -q -p examples/checkout.ldprofile examples/baseline.log examples/candidate.log
          diff_code=$?
          java -jar "$JAR" check -q -b examples/baseline.log -b examples/baseline-2.log \
              --report junit:build/smoke.xml examples/candidate.log
          check_code=$?
          set -e
          test "$diff_code" -eq 1
          test "$check_code" -eq 1
          grep -q '<testsuites' build/smoke.xml
      - name: Upload jar
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: logdelta-jar
          path: logdelta-app/target/logdelta-*.jar

  action:
    name: GitHub Action self-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Run the action on the example logs
        id: logdelta
        uses: ./
        with:
          baseline: |
            examples/baseline.log
            examples/baseline-2.log
          candidate: examples/candidate.log
          profile: examples/checkout.ldprofile
          comment: 'false'
          fail: 'false'
      - name: Check the outputs
        shell: bash
        run: |
          test "${{ steps.logdelta.outputs.result }}" = fail
          test "${{ steps.logdelta.outputs.new-problems }}" -gt 0
          test -s "${{ steps.logdelta.outputs.junit }}"

  installers:
    name: Installer (${{ matrix.type }}, ${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v') || inputs.installers
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            type: deb
          - os: ubuntu-latest
            type: rpm
          - os: windows-latest
            type: msi
          - os: macos-latest
            type: dmg
          - os: macos-15-intel
            type: dmg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install packaging tools (rpm)
        if: matrix.type == 'rpm'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Install packaging tools (WiX)
        if: matrix.type == 'msi'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue) -and -not (Get-Command wix -ErrorAction SilentlyContinue)) {
            dotnet tool install --global wix --version 5.0.2
            wix extension add -g WixToolset.Util.wixext/5.0.2
            wix extension add -g WixToolset.UI.wixext/5.0.2
          }
      - name: Build installer
        shell: bash
        run: ./scripts/package.sh ${{ matrix.type }}
      - name: Name the macOS image by architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          arch=$(uname -m)
          for f in dist/installers/*.dmg; do mv "$f" "${f%.dmg}-$arch.dmg"; done
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}-${{ matrix.type }}
          path: dist/installers/*.*

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
