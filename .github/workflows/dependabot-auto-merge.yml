# Turns on auto-merge for Dependabot's pull requests. GitHub then merges each one as soon as
# every required status check has passed, and never if a check fails.
#
# One-time repository setup (see CONTRIBUTING.md, "Dependency updates"):
#   1. Settings > General > Pull Requests: enable "Allow auto-merge".
#   2. Settings > Branches (or Rules): protect `main` and require the CI checks to pass.
#      Without required checks, GitHub would merge immediately instead of waiting.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'Yeongwonhan-Jeolmang/logdelta'
    steps:
      - name: Read the update's metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (squash)
        # To keep major version bumps for manual review, uncomment:
        # if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
