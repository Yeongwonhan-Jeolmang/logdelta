name: Feature request
description: Suggest an improvement, a new built-in rule or a new log format
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you would like it to work.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Comparison and insights
        - Normalization rules
        - Log formats (JSON, logfmt, presets)
        - Desktop app
        - Command line
        - Reports
        - GitHub Action
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Example lines
      description: >
        For new rules or log formats: lines that should be masked or recognised, and similar lines
        that must NOT be.
      render: text
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
