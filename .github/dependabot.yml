# Monthly dependency updates, one pull request per ecosystem: all Maven plugins and libraries
# together, and all GitHub Actions together. The Dependabot auto-merge workflow merges each
# group once the required checks pass.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      maven:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
